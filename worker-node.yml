---
# Play 1: Run only on the control plane node to generate the token
- name: Get Join Command from Control Node
  hosts: control-node
  become: true
  tasks:
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: cmd_result
      changed_when: false

# Play 2: Run on worker nodes (all hosts except 'control-node')
- name: Run Join Command on Worker Nodes
  hosts: all:!test
  become: true
  tasks:
    - name: Join worker node to cluster
      ansible.builtin.command: "{{ hostvars['test']['cmd_result']['stdout'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf