---
# Play 1: Generate the join command on the control plane
- name: Get Join Command from Control Node
  hosts: control-plane
  become: true
  tasks:
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: cmd_result
      changed_when: false

# Play 2: Run it on the worker
- name: Run Join Command on Worker Nodes
  hosts: all:!control-plane
  become: true
  tasks:
    - name: Join worker node to cluster
      ansible.builtin.command: "{{ hostvars['control-plane']['cmd_result']['stdout'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf