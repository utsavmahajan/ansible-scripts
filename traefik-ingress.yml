---
- name: TRAEFIK-INGRESS Installation
  hosts: servers

  tasks:
    - name: Allow scheduling on control-plane (single-node cluster)
      ansible.builtin.command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      register: taint
      failed_when: taint.rc != 0 and 'not found' not in taint.stderr
      changed_when: "'untainted' in taint.stdout"
      
    - name: Traefik-Ingress Repo Add
      ansible.builtin.command: helm repo add traefik https://traefik.github.io/charts

    - name: Repo Update
      ansible.builtin.command: helm repo update

    - name: Installing Traefik-Ingress via Helm
      ansible.builtin.command: >
        helm upgrade --install traefik traefik/traefik \
        --namespace traefik \
        --create-namespace \
        --set service.type=NodePort